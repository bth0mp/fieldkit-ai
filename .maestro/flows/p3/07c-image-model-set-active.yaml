# P0 E2E: Image Model Set Active
# Tests selecting a downloaded image model from the home screen picker
# Assumes an image model is already downloaded but not active

appId: ${APP_ID}
name: "P0: Image Model Set Active"
tags:
  - p0
  - models
  - image
---

# ==============================
# Launch and setup
# ==============================
- evalScript: "${console.log('IMG_SET_ACTIVE - Launch')}"
- launchApp

- extendedWaitUntil:
    notVisible:
      id: "app-loading"
    timeout: 30000

# Handle onboarding
- runFlow:
    when:
      visible:
        text: "Welcome to Off Grid"
    commands:
      - evalScript: "${console.log('IMG_SET_ACTIVE - Skip onboarding')}"
      - tapOn:
          text: "Skip"
      - extendedWaitUntil:
          visible:
            text: "Skip for Now"
          timeout: 30000
      - tapOn:
          text: "Skip for Now"

# Handle download prompt
- runFlow:
    when:
      visible:
        text: "Download Your First Model"
    commands:
      - evalScript: "${console.log('IMG_SET_ACTIVE - Skip prompt')}"
      - tapOn:
          text: "Skip for Now"

# Wait for home screen
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- evalScript: "${console.log('IMG_SET_ACTIVE - On home')}"

# ==============================
# Ensure model is unloaded first
# ==============================
# The Home chip opens the Models screen; the Image Models tab lists the downloaded image models
- evalScript: "${console.log('IMG_SET_ACTIVE - Open Models')}"
- tapOn:
    id: "models-summary"

- extendedWaitUntil:
    visible:
      id: "models-screen"
    timeout: 10000
- tapOn:
    text: "Image Models"
- extendedWaitUntil:
    visible:
      id: "your-models-image"
    timeout: 10000

# If an image model is already in use, unload it (Unload keeps the Models screen open)
- runFlow:
    when:
      visible:
        text: "In use"
    commands:
      - evalScript: "${console.log('IMG_SET_ACTIVE - Model already loaded, unloading...')}"
      - tapOn:
          text: "Unload"

      # Wait for model to unload: no row is in use now
      - extendedWaitUntil:
          notVisible:
            text: "In use"
          timeout: 30000

# ==============================
# Select image model
# ==============================
- evalScript: "${console.log('IMG_SET_ACTIVE - Select model')}"
- tapOn:
    id: "model-item"
    index: 0

# Use leaves the Models screen for Home
- evalScript: "${console.log('IMG_SET_ACTIVE - Waiting for model to load...')}"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

# Verify the model is now in use (don't check exact name as it could be any model)
- tapOn:
    id: "models-summary"
- extendedWaitUntil:
    visible:
      id: "models-screen"
    timeout: 10000
- tapOn:
    text: "Image Models"
- assertVisible:
    text: "In use"
- tapOn:
    id: "models-back"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- evalScript: "${console.log('IMG_SET_ACTIVE - Model loaded successfully')}"

- evalScript: "${console.log('IMG_SET_ACTIVE - PASSED')}"
