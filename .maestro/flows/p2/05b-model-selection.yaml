# P0 E2E: Model Selection
# Tests selecting a model from multiple downloaded models
#
# Precondition: At least 2 models downloaded, none loaded
# Test: Open picker → Select model → Verify loaded
# Postcondition: Model loaded and ready

appId: ${APP_ID}
name: "P0: Model Selection"
tags:
  - p0
  - model-selection
---

# ==============================
# Launch app
# ==============================
- evalScript: "${console.log('SELECTION - Launch')}"
- launchApp

- extendedWaitUntil:
    notVisible:
      id: "app-loading"
    timeout: 30000
- evalScript: "${console.log('SELECTION - App ready')}"

# ==============================
# Skip onboarding if needed
# ==============================
- runFlow:
    when:
      visible:
        text: "Welcome to Off Grid"
    commands:
      - evalScript: "${console.log('SELECTION - Skip onboarding')}"
      - tapOn:
          text: "Skip"
      - extendedWaitUntil:
          visible:
            text: "Skip for Now"
          timeout: 30000
      - tapOn:
          text: "Skip for Now"

- runFlow:
    when:
      visible:
        text: "Download Your First Model"
    commands:
      - evalScript: "${console.log('SELECTION - Skip prompt')}"
      - tapOn:
          text: "Skip for Now"

# ==============================
# Wait for home screen
# ==============================
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- evalScript: "${console.log('SELECTION - On home')}"
- takeScreenshot: 01-home

# ==============================
# Ensure we have at least 2 models
# ==============================
# If no models, download 2
# If 1 model, download 1 more
# This ensures we can test selection between multiple models

- runFlow:
    when:
      visible:
        id: "setup-card"
    commands:
      # No models loaded, check if any downloaded
      - evalScript: "${console.log('SELECTION - Check models')}"
      - tapOn:
          id: "models-summary"
      - extendedWaitUntil:
          visible:
            id: "your-models-text"
          timeout: 10000

      # If no models exist, download one via setup
      - runFlow:
          when:
            visible:
              id: "your-models-empty"
          commands:
            - evalScript: "${console.log('SELECTION - Need to download model')}"
            - tapOn:
                id: "models-back"
            - extendedWaitUntil:
                visible:
                  id: "home-screen"
                timeout: 10000
            # Run setup to get a model (it ends on Home with that model in use)
            - runFlow: 00-setup-model.yaml

      # Leave the Models screen if the models were already there (setup leaves it on its own)
      - evalScript: "${console.log('SELECTION - Close picker')}"
      - runFlow:
          when:
            visible:
              id: "models-screen"
          commands:
            - tapOn:
                id: "models-back"

# ==============================
# Unload any currently loaded model
# ==============================
- evalScript: "${console.log('SELECTION - Ensure no model loaded')}"
- tapOn:
    text: "Home"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# The New chat button is always in the tab bar, so a model in use shows as no setup card
- runFlow:
    when:
      notVisible:
        id: "setup-card"
    commands:
      # Model is loaded, unload it
      - evalScript: "${console.log('SELECTION - Unload current model')}"
      - tapOn:
          id: "models-summary"
      - extendedWaitUntil:
          visible:
            id: "models-screen"
          timeout: 10000
      - tapOn:
          text: "Unload"
      - tapOn:
          id: "models-back"
      - extendedWaitUntil:
          visible:
            id: "setup-card"
          timeout: 10000

- takeScreenshot: 02-ready-to-select

# ==============================
# Test: Select a model
# ==============================
- evalScript: "${console.log('SELECTION - Open picker')}"
- tapOn:
    id: "models-summary"

- extendedWaitUntil:
    visible:
      id: "your-models-text"
    timeout: 10000
- takeScreenshot: 03-picker

# Select first model in list (Use leaves the Models screen for Home)
- evalScript: "${console.log('SELECTION - Select model')}"
- tapOn:
    index: 0
    id: "model-item"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- takeScreenshot: 04-selected

# Handle low memory warning
- runFlow:
    when:
      visible:
        text: "Load Anyway"
    commands:
      - evalScript: "${console.log('SELECTION - Load anyway')}"
      - tapOn:
          text: "Load Anyway"

# ==============================
# Verify model loaded
# ==============================
- evalScript: "${console.log('SELECTION - Waiting for load')}"
- extendedWaitUntil:
    notVisible:
      id: "setup-card"
    timeout: 120000

- assertVisible:
    id: "model-chip-label"
- assertNotVisible:
    id: "setup-card"
- evalScript: "${console.log('SELECTION - PASSED')}"
- takeScreenshot: 99-complete
